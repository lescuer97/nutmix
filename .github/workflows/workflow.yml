name: Nutmix
on:
  pull_request:
    branches: [master, signet, admin_dashboard]

jobs:
  ai-review-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Test AI review authorization and CI gates
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v

  ai-review-image-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build Fiach and run upstream, boundary, and mock-provider tests
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .github/ai-review
          load: true
          tags: nutmix-fiach:ci
          cache-from: type=gha,scope=fiach-ci
          cache-to: type=gha,scope=fiach-ci,mode=max
      - name: Exercise actual runtime sandbox without network or credentials
        run: |
          image=$(docker image inspect --format '{{.Id}}' nutmix-fiach:ci)
          python3 .github/scripts/ai_review.py sandbox-smoke "$image"

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: extractions/setup-just@v3
      - name: Set up Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: just install-deps

      - name: Generate code (proto, templ)
        run: |
          just gen-proto
          just gen-templ
          just web-install

      - name: Build
        run: just build

  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: extractions/setup-just@v3
      - name: Set up Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: just install-deps

      - name: Generate code (proto, templ)
        run: |
          just gen-proto
          just gen-templ
          just web-install

      - name: Test build
        run: just build

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        test-dir:
          - api/cashu
          - cmd/nutmix
          - internal/mint
          - internal/signer
          - internal/database/postgresql
          - internal/lightning
          - internal/routes/admin
          - internal/routes/middleware
          - internal/utils
          - pkg/crypto
          - test/configTest
          - test/setupTest

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: extractions/setup-just@v3
      - name: Set up Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Go Toolchain info
        run: |
          go version

      - name: Install dependencies
        run: just install-deps

      - name: Generate code (proto, templ)
        run: |
          just gen-proto
          just gen-templ
          just web-install
          just web-build-prod

      - name: Test ${{ matrix.test-dir }}
        run: go test -v ./${{ matrix.test-dir }}/...
